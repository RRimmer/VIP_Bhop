// Сколько секунд будет доступен BHOP (0 - всегда доступен на протижении раунда)
// How many seconds BHOP is available (0 - always available during the round)
// -
// Default: "5"
// Minimum: "0.000000"
bhop_allowtime "5"

// Режим оповещений (0 выкл, 1 чат, 2 Alert)
// Notification mode (0 off, 1 chat, 2 Alert)
// -
// Default: "2"
bhop_info "2"

// Через сколько будет доступен/перезаряжаться BHOP (0 - сразу доступен/отключить)
// Cooldown before BHOP becomes available again (0 - available immediately/disable)
// -
// Default: "15"
// Minimum: "0.000000"
bhop_locktime "15"

// Кому писать сообщения (0 - всем, 1 - только VIP с доступом)
// Who receives notifications (0 - everyone, 1 - only VIP with access)
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
bhop_notify "0"

// Сколько секунд BHOP отключен после урона от противника
// How many seconds BHOP is disabled after taking damage from an enemy
// -
// Default: "2"
// Minimum: "0.000000"
bhop_restrict_time "2"

// Отключать BHOP после урона от противника (0 - выкл, 1 - вкл)
// Disable BHOP after taking damage from an enemy (0 - off, 1 - on)
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
bhop_restrict_type "0"

// Отключать BHOP в первом раунде (с поддержкой mp_halftime) (0 - выкл, 1 - вкл)
// Disable BHOP in the first round (with mp_halftime support) (0 - off, 1 - on)
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
bhop_first_round_off "0"
