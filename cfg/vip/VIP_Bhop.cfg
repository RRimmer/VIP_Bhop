// Кому писать сообщения (0 - всем, 1 - только VIP с доступом)
// Who receives notifications (0 - everyone, 1 - only VIP with access)
// -
// Default: "0"
// Minimum: "0.000000"
// Maximum: "1.000000"
bhop_notify "0"
